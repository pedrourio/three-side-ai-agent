[project]
name = "three-side-ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff >= 0.16 formata blocos Python dentro de Markdown; docs/ é documentação,
# e os trechos das tarefas são fragmentos de patch que ele reformataria errado.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: precisa de LLM real; fora do make test",
    "db: precisa de Postgres de pé; roda por make test-db",
]
addopts = "-m 'not live and not db'"
